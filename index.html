es into the exact visual state shown in the reference image: a detailed side-section schematic of the Tang Dougong at Foguang Temple (dated 857 on the upper dynasty timeline bar). A bold red lever line traces diagonally through the Ang, labeled '挑檐' at the elevated roof eave end, pivoting over a fulcrum labeled '支点', with the interior tail pinned firmly by the roof beam labeled '梁压昂尾', accompanied by the explanatory text '昂 斜置的长木' and bottom citations from the Yingzao Fashi. Following this explanation of the lever mechanism, the video moves chronologically to display early precedents in Han stone pillars and Northern Dynasty cave temples. It narrates Liang Sicheng and Lin Huiyin's 1937 field discovery in Mount Wutai where temple beam inscriptions verified the 857 AD construction date. Next, a three-stage stylistic chart compares '豪劲', '醇和', and '羁直' periods. Sectional diagrams of Qing construction illustrate how the beam head directly took over the load, flattening the Ang into a decorative carving and turning Dougong into dense decorative trim under the eaves. Isometric diagrams then explain the modular proportion systems ('材' in Song and '斗口' in Qing). A multi-building comparative chart plots eleven historical structures along a timeline, tracking the bracket-to-column ratio dropping from 1/2 to 1/5, before concluding with a comparison between the Chinese Dougong system and the Greek Doric order.","C2VC-0410-v2v":"A dynamic product showcase demonstrates how Verde seamlessly propagates updated company knowledge into developer workflows and conversational AI.\n\nPrior to the reference clip, the demo begins in Claude, where Maya types: 'We just agreed: annual plans get a 30-day refund window, not 14. Save it to Verde for the team.' Claude invokes Verde, marks the prior 14-day document superseded, and displays an embedded policy card. Clicking this card opens the Verde knowledge base ('getverde.ai/t/northwind') in dark mode, showing the document 'Annual plans have a 3
